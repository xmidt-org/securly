---
version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - godot
    - gosec
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errorlint:
      errorf: false
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - goconst
        path: _test.go
      - linters:
          - gosec
        path: internal/credentials/cmd/example/main.go
      - linters:
          - bodyclose
          - errorlint
          - goconst
          - gosec
          - govet
          - misspell
          - prealloc
          - staticcheck
        path: internal/nhooyr.io/*
    paths:
      - internal/jwtxt/keypairs_for_test.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
